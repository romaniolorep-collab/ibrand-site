<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Maringá Calce – V3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,700;0,800;0,900;1,800;1,900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --pink:  #FF1F6E;
      --pink2: #FF5298;
      --dark:  #060610;
      --pad:   60px;
    }
    body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; }

    /* ════════════════════════════════
       CARD  1080 × 1080
    ════════════════════════════════ */
    .card {
      position:relative;
      width:1080px; height:1080px;
      overflow:hidden;
      background:var(--dark);
      display:flex;
    }

    /* ══ LEFT PANEL ══ */
    .left {
      flex:0 0 520px;
      display:flex;
      flex-direction:column;
      padding:var(--pad);
      position:relative;
      z-index:5;
      background:
        radial-gradient(ellipse 90% 80% at -10% 110%, rgba(255,31,110,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at  5%   5%, rgba(130,0,70,.15)    0%, transparent 55%),
        var(--dark);
    }

    /* thin grid lines on left panel */
    .left::before {
      content:'';
      position:absolute; inset:0; pointer-events:none; z-index:0;
      background-image:
        linear-gradient(rgba(255,31,110,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,31,110,.045) 1px, transparent 1px);
      background-size:60px 60px;
    }

    /* ── TOP ROW ── */
    .top-row {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:52px; position:relative; z-index:1;
    }
    .logo {
      height:38px; width:auto; max-width:140px;
      object-fit:contain; object-position:left;
      filter:brightness(0) invert(1); opacity:.88;
    }
    .tag {
      font-family:'Rajdhani',sans-serif;
      font-size:10px; font-weight:700; letter-spacing:3px;
      text-transform:uppercase; color:var(--pink2);
      border:1px solid rgba(255,82,152,.38); padding:6px 13px;
      background:rgba(255,31,110,.08);
    }

    /* ── EYEBROW ── */
    .eyebrow {
      display:flex; align-items:center; gap:12px;
      margin-bottom:28px; position:relative; z-index:1;
    }
    .eyebrow-bar { width:32px; height:2px; background:var(--pink); flex-shrink:0; }
    .eyebrow-t {
      font-family:'Rajdhani',sans-serif;
      font-size:12px; font-weight:600; letter-spacing:3.5px;
      text-transform:uppercase; color:var(--pink2);
    }

    /* ── MAIN TITLE ── */
    .title-block {
      position:relative; z-index:1; margin-bottom:40px;
    }
    .t1 {
      display:block;
      font-family:'Barlow Condensed',sans-serif;
      font-weight:900; font-style:italic;
      font-size:154px; line-height:.84;
      letter-spacing:-1px;
      color:#fff;
      text-shadow: 3px 4px 0 rgba(0,0,0,.75);
    }
    .t2 {
      display:block;
      font-family:'Barlow Condensed',sans-serif;
      font-weight:900; font-style:italic;
      font-size:158px; line-height:.84;
      letter-spacing:-1px;
      color:var(--pink);
      text-shadow:
        3px 4px 0 rgba(60,0,30,.9),
        0 0 55px rgba(255,31,110,1),
        0 0 110px rgba(255,31,110,.5);
    }

    /* ── DIVIDER ── */
    .divider {
      width:100%; height:1px;
      background:linear-gradient(to right, rgba(255,31,110,.6) 0%, rgba(255,31,110,.2) 70%, transparent 100%);
      margin:36px 0; position:relative; z-index:1;
    }

    /* ── DATE BLOCK ── */
    .date-block { position:relative; z-index:1; }
    .date-nums {
      display:flex; align-items:baseline; gap:0;
      line-height:1; margin-bottom:10px;
    }
    .dn {
      font-family:'Barlow Condensed',sans-serif;
      font-weight:900; font-style:italic;
      font-size:100px; color:#fff; line-height:1; letter-spacing:-1px;
      text-shadow:2px 3px 0 rgba(0,0,0,.6);
    }
    .dd {
      font-family:'Barlow Condensed',sans-serif;
      font-weight:300; font-style:italic;
      font-size:72px; color:var(--pink); opacity:.75;
      padding:0 5px 8px; line-height:1;
    }
    .date-label {
      display:flex; align-items:center; gap:12px;
    }
    .date-label-bar { width:24px; height:2px; background:var(--pink); flex-shrink:0; }
    .date-label-t {
      font-family:'Rajdhani',sans-serif;
      font-size:18px; font-weight:700; letter-spacing:5px;
      text-transform:uppercase; color:var(--pink2);
    }

    /* ── SPACER ── */
    .spacer { flex:1; }

    /* ── BOTTOM CTA ── */
    .cta {
      position:relative; z-index:1;
      border-top:1px solid rgba(255,31,110,.25);
      padding-top:22px;
      display:flex; align-items:center; gap:16px;
    }
    .cta-dot {
      width:8px; height:8px; border-radius:50%;
      background:var(--pink);
      box-shadow:0 0 10px rgba(255,31,110,.7);
      flex-shrink:0;
    }
    .cta-t {
      font-family:'Rajdhani',sans-serif;
      font-size:14px; font-weight:700; letter-spacing:5px;
      text-transform:uppercase; color:#fff;
    }

    /* ══ DIVIDER LINE ══ */
    .v-line {
      position:absolute;
      left:520px; top:0; bottom:0;
      width:3px; z-index:10;
      background:linear-gradient(to bottom,
        transparent 0%,
        var(--pink)              8%,
        var(--pink)              92%,
        transparent 100%);
      box-shadow:0 0 12px rgba(255,31,110,.65), 0 0 30px rgba(255,31,110,.30);
    }

    /* ══ RIGHT PANEL ══ */
    .right {
      flex:0 0 560px;
      position:relative;
      overflow:hidden;
    }
    .right img {
      width:100%; height:100%;
      object-fit:cover;
      object-position:30% center;
      display:block;
    }
    /* gradient to blend top/bottom with dark bg */
    .right::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:180px; z-index:2;
      background:linear-gradient(to bottom, var(--dark) 0%, transparent 100%);
    }
    .right::after {
      content:'';
      position:absolute; bottom:0; left:0; right:0; height:140px; z-index:2;
      background:linear-gradient(to top, var(--dark) 0%, transparent 100%);
    }
    /* subtle left-edge blend with the divider line */
    .right-left-fade {
      position:absolute; top:0; bottom:0; left:0; width:50px; z-index:3;
      background:linear-gradient(to right, rgba(6,6,16,.3), transparent);
      pointer-events:none;
    }

    /* ══ CORNER BRACKETS ══ */
    .brk {
      position:absolute; width:20px; height:20px; z-index:20;
    }
    .brk-tl { top:42px; left:42px;
      border-top:2px solid rgba(255,31,110,.6); border-left:2px solid rgba(255,31,110,.6); }
    .brk-tr { top:42px; right:42px;
      border-top:2px solid rgba(255,31,110,.3); border-right:2px solid rgba(255,31,110,.3); }
    .brk-bl { bottom:42px; left:42px;
      border-bottom:2px solid rgba(255,31,110,.35); border-left:2px solid rgba(255,31,110,.35); }
    .brk-br { bottom:42px; right:42px;
      border-bottom:2px solid rgba(255,31,110,.25); border-right:2px solid rgba(255,31,110,.25); }

    /* ══ OUTER EDGES ══ */
    .edge-t { position:absolute; top:0; left:0; right:0; height:3px; z-index:20;
      background:linear-gradient(to right, var(--pink) 0%, rgba(255,31,110,.3) 50%, transparent 80%); }
    .edge-b { position:absolute; bottom:0; left:0; right:0; height:3px; z-index:20;
      background:linear-gradient(to right, rgba(255,31,110,.5) 0%, var(--pink) 48%, rgba(255,31,110,.15) 100%); }
  </style>
</head>
