<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maringá Calce – Reebok | 9·10·11 Junho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,800&family=Barlow:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --pink: #FF1F6E; --pink2: #FF5CA0; --dark: #060610;
    }
    body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; }

    .card {
      position:relative; width:1080px; height:1080px; overflow:hidden;
      background:var(--dark); isolation:isolate;
    }

    /* BG */
    .bg {
      position:absolute; inset:0;
      background:
        radial-gradient(ellipse 110% 100% at 108%  112%, rgba(255,10,90,.70) 0%, transparent 52%),
        radial-gradient(ellipse  55%  55% at  78%   65%, rgba(255,10,90,.22) 0%, transparent 58%),
        radial-gradient(ellipse  35%  30% at   2%    2%, rgba(130,0,70,.15)  0%, transparent 55%),
        linear-gradient(145deg, #050510 0%, #0C0517 45%, #130A16 100%);
    }
    .grid {
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(255,31,110,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,31,110,.05) 1px, transparent 1px);
      background-size:60px 60px;
      mask-image: linear-gradient(148deg, transparent 20%, rgba(0,0,0,.45) 52%, rgba(0,0,0,.9) 100%);
      -webkit-mask-image: linear-gradient(148deg, transparent 20%, rgba(0,0,0,.45) 52%, rgba(0,0,0,.9) 100%);
    }
    /* dark vignette on left — keeps text area clean */
    .vignette {
      position:absolute; inset:0; z-index:2;
      background: linear-gradient(to right,
        rgba(5,5,16,1.0) 0%,
        rgba(5,5,16,.96) 28%,
        rgba(5,5,16,.55) 52%,
        transparent      72%);
    }

    /* ═ SHOE ═ */
    .shoe-zone {
      position:absolute; right:-120px; bottom:30px;
      width:860px; height:860px; z-index:1;
    }
    .shoe-img {
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:contain; object-position:right bottom;
      transform: rotate(-6deg) scale(1.05);
      transform-origin: center bottom;
      filter:
        hue-rotate(288deg)
        saturate(3.2)
        brightness(1.1)
        contrast(1.05)
        drop-shadow(0 0 60px rgba(255,20,110,.8))
        drop-shadow(0 20px 80px rgba(255,20,110,.5))
        drop-shadow(0 0 200px rgba(255,20,110,.3));
    }
    /* Color overlay: paints shoe hot-pink */
    .shoe-color {
      position:absolute; inset:0;
      background:radial-gradient(ellipse 72% 68% at 62% 68%,
        rgba(255,20,100,1)   0%,
        rgba(255,10,80,.88)  38%,
        rgba(200,0,60,.55)   65%,
        transparent          88%);
      mix-blend-mode:color;
      pointer-events:none;
    }
    /* Fade left edge of shoe into dark bg */
    .shoe-fade {
      position:absolute; inset:0; z-index:3;
      background:linear-gradient(to right,
        rgba(5,5,16,1)   0%,
        rgba(5,5,16,.85) 18%,
        rgba(5,5,16,.3)  38%,
        transparent      55%);
      pointer-events:none;
    }
    /* Bottom glow puddle */
    .shoe-glow {
      position:absolute; bottom:-80px; left:5%; right:5%; height:220px;
      background:radial-gradient(ellipse 90% 100% at 50% 10%,
        rgba(255,20,110,.5) 0%, transparent 70%);
      filter:blur(24px); z-index:0;
    }

    /* ═ TOP BAR ═ */
    .top-bar {
      position:absolute; top:52px; left:62px; right:62px;
      display:flex; align-items:center; justify-content:space-between; z-index:10;
    }
    .reebok-logo {
      height:44px; width:auto; max-width:165px;
      object-fit:contain; object-position:left;
      filter:brightness(0) invert(1); opacity:.88;
    }
    .pill {
      font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700;
      letter-spacing:3.5px; text-transform:uppercase; color:var(--pink2);
      border:1px solid rgba(255,92,160,.4); padding:7px 16px;
      background:rgba(255,31,110,.1);
    }

    /* ═ CONTENT ═ */
    .content {
      position:absolute; left:62px; top:150px; z-index:10; max-width:580px;
    }
    /* eyebrow */
    .ey {
      display:flex; align-items:center; gap:14px; margin-bottom:20px;
    }
    .ey::before {
      content:''; width:40px; height:2px; background:var(--pink); flex-shrink:0;
    }
    .ey-t {
      font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700;
      letter-spacing:4px; text-transform:uppercase; color:var(--pink2);
    }
    /* Title */
    .t1 {
      font-family:'Bebas Neue',sans-serif; font-size:182px; line-height:.83;
      letter-spacing:2px; color:#fff; display:block;
      text-shadow: 0 0 120px rgba(255,31,110,.2), 2px 3px 0 rgba(0,0,0,.75);
    }
    .t2 {
      font-family:'Bebas Neue',sans-serif; font-size:186px; line-height:.83;
      letter-spacing:2px; color:var(--pink); display:block;
      text-shadow:
        0 0  60px rgba(255,31,110,.9),
        0 0 130px rgba(255,31,110,.5),
        2px 3px 0 rgba(70,0,35,.9);
      margin-bottom:46px;
    }
    /* Date */
    .date {
      display:flex; align-items:flex-end;
    }
    .dn {
      font-family:'Bebas Neue',sans-serif; font-size:116px; color:#fff;
      line-height:1; letter-spacing:-1px;
      text-shadow:2px 2px 0 rgba(0,0,0,.55);
    }
    .dd {
      font-family:'Bebas Neue',sans-serif; font-size:82px; color:var(--pink);
      line-height:1; padding:0 3px 10px; opacity:.85;
    }
    .dm {
      margin-left:20px; padding-left:18px;
      border-left:2px solid rgba(255,31,110,.5);
      padding-bottom:12px; display:flex; flex-direction:column; gap:5px;
    }
    .dm-n {
      font-family:'Barlow Condensed',sans-serif; font-size:25px; font-weight:800;
      letter-spacing:5px; text-transform:uppercase; color:var(--pink2); line-height:1;
    }
    .dm-y {
      font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:400;
      letter-spacing:3px; color:rgba(255,255,255,.28); line-height:1;
    }

    /* ═ BOTTOM BAR ═ */
    .bot {
      position:absolute; bottom:0; left:0; right:0; height:80px;
      display:flex; align-items:center; padding:0 62px; z-index:15;
      background:linear-gradient(90deg,
        rgba(255,31,110,1.0)  0%,
        rgba(255,31,110,.92) 40%,
        rgba(255,31,110,.25) 72%,
        transparent 100%);
    }
    .bl {
      font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:800;
      letter-spacing:6px; text-transform:uppercase; color:#fff;
    }
    .br {
      margin-left:auto;
      font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:500;
      letter-spacing:2.5px; text-transform:uppercase; color:rgba(255,255,255,.5);
    }

    /* ═ DECORATIVE ═ */
    .ea-r { position:absolute; top:0; right:0; bottom:0; width:4px; z-index:20;
      background:linear-gradient(to bottom, var(--pink) 0%, rgba(255,31,110,.2) 55%, transparent 100%); }
    .ea-t { position:absolute; top:0; left:0; right:0; height:4px; z-index:20;
      background:linear-gradient(to right, transparent 0%, rgba(255,31,110,.3) 50%, var(--pink) 100%); }
    .sk  { position:absolute; left:0; right:0; height:1px; z-index:5;
      background:linear-gradient(90deg, transparent 0%, rgba(255,31,110,.3) 20%, rgba(255,31,110,.65) 52%, transparent 100%); }
    .sk1 { top:370px; }
    .sk2 { top:375px; opacity:.35; }
    .br-tl {
      position:absolute; top:42px; left:50px; width:24px; height:24px; z-index:20;
      border-top:2px solid rgba(255,31,110,.55); border-left:2px solid rgba(255,31,110,.55);
    }
    .br-br {
      position:absolute; bottom:85px; right:46px; width:24px; height:24px; z-index:20;
      border-bottom:2px solid rgba(255,31,110,.3); border-right:2px solid rgba(255,31,110,.3);
    }
    /* subtle noise/grain texture */
    .grain {
      position:absolute; inset:0; z-index:4; pointer-events:none; opacity:.04;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:200px 200px;
    }
  </style>
</head>

  <div class="sk sk2"></div>
